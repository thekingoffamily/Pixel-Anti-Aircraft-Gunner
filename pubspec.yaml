name: pixel_zenitchik
description: "Пиксельный Зенитчик — ретро-аркада для Android: защити базу от роя автономных дронов."
publish_to: "none"

# Версия приложения для RuStore: versionName+versionCode
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Хранение рекорда и настроек.
  shared_preferences: ">=2.2.0 <3.0.0"
  # Короткие 8-bit эффекты; сэмплы генерируются tool/gen_sounds.dart.
  audioplayers: ">=6.0.0 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Генерация иконки приложения из logo-app.png (assets/icon/app_icon.png).
  flutter_launcher_icons: ">=0.14.0 <0.15.0"

flutter:
  uses-material-design: true
  assets:
    - logo-app.png
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
